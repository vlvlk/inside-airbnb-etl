# Inside Airbnb ETL Configuration
#
# This is the primary declarative configuration file: edit values here.
# Precedence (highest first): CLI/init args > environment variables > .env > this file > code defaults.
# Unknown keys are rejected with an error, so typos surface immediately.

database:
  host: localhost
  port: 5432
  name: airbnb
  user: airbnb
  password: airbnb

data:
  # Single root directory; raw/ and processed/ sub-paths are derived from it.
  data_path: ./data
  # The bundled Toronto snapshot ships as Parquet, so a fresh clone runs with
  # no download step. Point these at .csv / .csv.gz to read the originals
  # instead — the extractor is chosen from the extension.
  listings_file: listings.parquet
  calendar_file: calendar.parquet

dashboard:
  # Where the Streamlit dashboard reads its marts from:
  #   auto     -> PostgreSQL if reachable, otherwise the Parquet demo layer
  #   postgres -> PostgreSQL only (the production path)
  #   duckdb   -> the Parquet demo layer only (no database server needed)
  # The demo layer is a directory of Parquet files built from the committed
  # snapshot by scripts/build_demo_marts.py, so a fresh clone can serve the
  # dashboard without running the 8M-row load first.
  source: auto
  demo_dir: data/demo

pipeline:
  # Rows handed to the loader per COPY/INSERT (bounded memory per batch).
  batch_size: 100000
  # Rows read from CSV per pandas pass (larger = fewer pandas calls).
  chunk_size: 250000
  validate_data: true
  skip_invalid_rows: false
  # Use COPY FROM STDIN for raw loads; set false to fall back to row-wise
  # INSERT ... ON CONFLICT (slower, but works without COPY privileges).
  use_copy: true

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
