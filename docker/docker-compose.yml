services:
  postgres:
    image: postgres:16-alpine
    container_name: inside-airbnb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airbnb}
      POSTGRES_USER: ${POSTGRES_USER:-airbnb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airbnb}
    ports:
      - "5432:5432"
    volumes:
      # Only the data volume: the pipeline creates every schema itself through
      # ``PostgresLoader.run_ddl()``. Mounting ``sql/`` into
      # ``docker-entrypoint-initdb.d`` would also run the transform scripts at
      # init time, before any data is loaded.
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres 
      -c max_wal_size=2GB 
      -c min_wal_size=512MB
      -c checkpoint_timeout=15min
      -c shared_buffers=256MB
      -c synchronous_commit=off
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2000M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airbnb} -d ${POSTGRES_DB:-airbnb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: inside-airbnb-pipeline
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-airbnb}
      POSTGRES_USER: ${POSTGRES_USER:-airbnb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airbnb}
      DATA_PATH: /app/data
    volumes:
      - ../data:/app/data:ro
      - ../configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: uv run python -m src.pipeline --config configs/config.yaml

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: inside-airbnb-dashboard
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-airbnb}
      POSTGRES_USER: ${POSTGRES_USER:-airbnb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airbnb}
    ports:
      - "8501:8501"
    volumes:
      - ../configs:/app/configs:ro
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_completed_successfully
    command: >
      uv run streamlit run src/dashboard/app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true

volumes:
  postgres_data: